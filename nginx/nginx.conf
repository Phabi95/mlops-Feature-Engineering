worker_processes auto; # Utilize all available CPU cores for maximum throughput

events {
    worker_connections 2048; # High-concurrency connection limit
    multi_accept on;
}

http {
    # I/O Optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on; # Optimized for low-latency JSON payload delivery
    
    # Connection Persistence
    keepalive_timeout 65;
    keepalive_requests 1000;

    upstream fastapi_app {
        server api:8000;
        keepalive 32; # Enable connection pooling to the backend
    }

    server {
        listen 80;
        
        # Performance: Disable access logs to minimize disk I/O overhead
        access_log off; 

        location / {
            proxy_pass http://fastapi_app;
            
            # Protocol settings for upstream keepalive support
            proxy_http_version 1.1;
            proxy_set_header Connection ""; 
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Memory buffering to prevent disk-swapping
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 64k;

            # Strict timeouts for low-latency requirements
            proxy_read_timeout 10s;
            proxy_connect_timeout 5s;
            proxy_request_buffering off;
        }
    }
}